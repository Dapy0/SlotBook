services:
  postgres:
    image: postgres:16-alpine
    container_name: slotbook_postgres
    restart: always
    environment:
      POSTGRES_DB: slotbook_db
      POSTGRES_USER: slotbook_admin
      POSTGRES_PASSWORD: slotbook_TEMPPAS
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

volumes:
  pgdata:
